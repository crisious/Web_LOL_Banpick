name: QA

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      external_readonly_url:
        description: "Optional https:// read-only demo URL for external smoke artifact collection"
        required: false
        type: string
      external_protected_url:
        description: "Optional https:// protected demo URL for external smoke artifact collection"
        required: false
        type: string

permissions:
  contents: read

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Validate external read-only smoke URL
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.external_readonly_url != '' }}
        env:
          EXTERNAL_READONLY_URL: ${{ inputs.external_readonly_url }}
        run: npm run smoke:validate:external-url -- external_readonly_url "$EXTERNAL_READONLY_URL"

      - name: Validate external protected smoke URL
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.external_protected_url != '' }}
        env:
          EXTERNAL_PROTECTED_URL: ${{ inputs.external_protected_url }}
        run: npm run smoke:validate:external-url -- external_protected_url "$EXTERNAL_PROTECTED_URL"

      - name: Run unit tests
        run: npm test

      - name: Start read-only demo
        run: |
          HOST=127.0.0.1 npm run start:readonly > /tmp/lol-ai-coach-readonly.log 2>&1 &
          echo $! > /tmp/lol-ai-coach-readonly.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8123/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lol-ai-coach-readonly.log
          exit 1

      - name: Run read-only smoke report
        run: npm run smoke:report:readonly

      - name: Stop read-only demo
        if: always()
        run: |
          if [ -f /tmp/lol-ai-coach-readonly.pid ]; then
            kill "$(cat /tmp/lol-ai-coach-readonly.pid)" 2>/dev/null || true
          fi
          cat /tmp/lol-ai-coach-readonly.log 2>/dev/null || true

      - name: Detect protected smoke token
        id: protected-smoke-token
        env:
          PUBLIC_DEMO_TOKEN: ${{ secrets.PUBLIC_DEMO_TOKEN }}
        run: |
          if [ -n "$PUBLIC_DEMO_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Start protected demo
        if: ${{ steps.protected-smoke-token.outputs.available == 'true' }}
        env:
          PUBLIC_DEMO_TOKEN: ${{ secrets.PUBLIC_DEMO_TOKEN }}
        run: |
          HOST=127.0.0.1 npm run start:protected > /tmp/lol-ai-coach-protected.log 2>&1 &
          echo $! > /tmp/lol-ai-coach-protected.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8123/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lol-ai-coach-protected.log
          exit 1

      - name: Run protected smoke report
        if: ${{ steps.protected-smoke-token.outputs.available == 'true' }}
        env:
          PUBLIC_DEMO_TOKEN: ${{ secrets.PUBLIC_DEMO_TOKEN }}
        run: npm run smoke:report:protected

      - name: Stop protected demo
        if: ${{ always() && steps.protected-smoke-token.outputs.available == 'true' }}
        run: |
          if [ -f /tmp/lol-ai-coach-protected.pid ]; then
            kill "$(cat /tmp/lol-ai-coach-protected.pid)" 2>/dev/null || true
          fi
          cat /tmp/lol-ai-coach-protected.log 2>/dev/null || true

      - name: Run external read-only smoke report
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.external_readonly_url != '' }}
        env:
          EXTERNAL_READONLY_URL: ${{ inputs.external_readonly_url }}
        run: npm run smoke:report:external:readonly -- "$EXTERNAL_READONLY_URL"

      - name: Require token for external protected smoke
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.external_protected_url != '' && steps.protected-smoke-token.outputs.available != 'true' }}
        run: |
          echo "external_protected_url requires repository secret PUBLIC_DEMO_TOKEN" >&2
          exit 1

      - name: Run external protected smoke report
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.external_protected_url != '' && steps.protected-smoke-token.outputs.available == 'true' }}
        env:
          EXTERNAL_PROTECTED_URL: ${{ inputs.external_protected_url }}
          PUBLIC_DEMO_TOKEN: ${{ secrets.PUBLIC_DEMO_TOKEN }}
        run: npm run smoke:report:external:protected -- "$EXTERNAL_PROTECTED_URL"

      - name: Upload QA automation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-automation-${{ github.run_id }}
          path: test-artifacts/qa-automation/
          if-no-files-found: ignore
          retention-days: 14
